<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="url(#apiBgGrad)" />

  <!-- Window Header -->
  <rect width="600" height="42" fill="#0b1120" rx="12 12 0 0" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="300" y="26" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" text-anchor="middle">ASP.NET Core Web API — ProductsController.cs</text>

  <!-- Left Panel: Endpoints List -->
  <rect x="18" y="58" width="240" height="304" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="82" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">API Endpoints (v1)</text>

  <!-- Endpoint 1: GET /api/products -->
  <g transform="translate(28, 98)">
    <rect width="220" height="38" rx="6" fill="#1e293b" />
    <rect x="6" y="8" width="42" height="22" rx="4" fill="#0284c7" />
    <text x="27" y="23" fill="#ffffff" font-family="Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle">GET</text>
    <text x="56" y="23" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">/api/products</text>
  </g>

  <!-- Endpoint 2: GET /api/products/{id} -->
  <g transform="translate(28, 144)">
    <rect width="220" height="38" rx="6" fill="#1e293b" />
    <rect x="6" y="8" width="42" height="22" rx="4" fill="#0284c7" />
    <text x="27" y="23" fill="#ffffff" font-family="Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle">GET</text>
    <text x="56" y="23" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">/api/products/{id}</text>
  </g>

  <!-- Endpoint 3: POST /api/products -->
  <g transform="translate(28, 190)">
    <rect width="220" height="38" rx="6" fill="#1e293b" />
    <rect x="6" y="8" width="42" height="22" rx="4" fill="#059669" />
    <text x="27" y="23" fill="#ffffff" font-family="Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle">POST</text>
    <text x="56" y="23" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">/api/products</text>
  </g>

  <!-- Endpoint 4: PUT /api/products/{id} -->
  <g transform="translate(28, 236)">
    <rect width="220" height="38" rx="6" fill="#1e293b" />
    <rect x="6" y="8" width="42" height="22" rx="4" fill="#d97706" />
    <text x="27" y="23" fill="#ffffff" font-family="Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle">PUT</text>
    <text x="56" y="23" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">/api/products/{id}</text>
  </g>

  <!-- Endpoint 5: DELETE /api/products/{id} -->
  <g transform="translate(28, 282)">
    <rect width="220" height="38" rx="6" fill="#1e293b" />
    <rect x="6" y="8" width="42" height="22" rx="4" fill="#dc2626" />
    <text x="27" y="23" fill="#ffffff" font-family="Consolas, monospace" font-size="9" font-weight="bold" text-anchor="middle">DEL</text>
    <text x="56" y="23" fill="#f8fafc" font-family="Consolas, monospace" font-size="11">/api/products/{id}</text>
  </g>

  <!-- Postman Verification Badge -->
  <g transform="translate(28, 328)">
    <text x="110" y="16" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">✓ Tested with Postman Collections</text>
  </g>

  <!-- Right Panel: JSON Response & HTTP 200 OK -->
  <rect x="270" y="58" width="312" height="304" rx="8" fill="url(#codeGrad)" stroke="#1e293b" stroke-width="1" />
  
  <rect x="282" y="70" width="105" height="24" rx="4" fill="#064e3b" />
  <text x="334" y="86" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle">HTTP 200 OK</text>
  <text x="420" y="86" fill="#64748b" font-family="Consolas, monospace" font-size="10">Content-Type: json</text>

  <!-- Code / JSON Mockup -->
  <text x="285" y="120" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">{</text>
  <text x="298" y="138" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">  &quot;statusCode&quot;: <tspan fill="#fbbf24">200</tspan>,</text>
  <text x="298" y="156" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">  &quot;isSuccess&quot;: <tspan fill="#34d399">true</tspan>,</text>
  <text x="298" y="174" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">  &quot;data&quot;: {</text>
  <text x="312" y="192" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;id&quot;: <tspan fill="#fbbf24">402</tspan>,</text>
  <text x="312" y="210" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;name&quot;: <tspan fill="#a7f3d0">&quot;Enterprise Switch 24P&quot;</tspan>,</text>
  <text x="312" y="228" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;sku&quot;: <tspan fill="#a7f3d0">&quot;NET-SW-24P-01&quot;</tspan>,</text>
  <text x="312" y="246" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;category&quot;: <tspan fill="#a7f3d0">&quot;Networking&quot;</tspan>,</text>
  <text x="312" y="264" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;price&quot;: <tspan fill="#fbbf24">349.99</tspan>,</text>
  <text x="312" y="282" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">    &quot;inStock&quot;: <tspan fill="#34d399">true</tspan></text>
  <text x="298" y="300" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">  },</text>
  <text x="298" y="318" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">  &quot;timestamp&quot;: <tspan fill="#a7f3d0">&quot;2026-09-18T17:00:00Z&quot;</tspan></text>
  <text x="285" y="336" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">}</text>
</svg>
