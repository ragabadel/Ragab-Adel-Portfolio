  <text x="168" y="104" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">1,248</text>

  <rect x="264" y="58" width="98" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="276" y="78" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">Active Doctors</text>
  <text x="276" y="104" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">32</text>

