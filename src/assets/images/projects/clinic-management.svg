  <text x="24" y="185" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">👨‍⚕️ Doctors</text>
  <text x="24" y="215" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">📅 Visits &amp; Appts</text>
