  <rect x="385" y="204" width="62" height="18" rx="9" fill="#065f46" />
  <text x="416" y="217" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Completed</text>
  <text x="495" y="216" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Paid ($75)</text>

  <line x1="168" y1="228" x2="572" y2="228" stroke="#334155" stroke-width="0.5" />

  <text x="180" y="248" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="11">Sara Ibrahim</text>
  <text x="280" y="248" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Pediatrics</text>
  <rect x="385" y="236" width="62" height="18" rx="9" fill="#1e3a8a" />
  <text x="416" y="249" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">In Visit</text>
  <text x="495" y="248" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Pending</text>

  <line x1="168" y1="260" x2="572" y2="260" stroke="#334155" stroke-width="0.5" />

  <text x="180" y="280" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="11">Ahmed Hassan</text>
  <text x="280" y="280" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Orthopedics</text>
  <rect x="385" y="268" width="62" height="18" rx="9" fill="#312e81" />
  <text x="416" y="281" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Scheduled</text>
  <text x="495" y="280" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Scheduled</text>

