    <text x="30" y="16" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EF Core</text>
  </g>
  <g transform="translate(338, 318)">
    <rect width="82" height="24" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="41" y="16" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SQL Server</text>
  </g>
  <g transform="translate(428, 318)">
    <rect width="50" height="24" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
